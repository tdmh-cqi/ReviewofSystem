<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Lou Valmar T. Datu - Clinical Summary</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
body { font-family: 'Inter', sans-serif; }
/* Smooth scrolling and transitions */
html { scroll-behavior: smooth; }
.fade-in { animation: fadeIn 0.3s ease-in-out; }
@keyframes fadeIn {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}
/* Toast Notification Animation */
@keyframes slideUp {
from { bottom: -50px; opacity: 0; }
to { bottom: 20px; opacity: 1; }
}
.toast-show {
animation: slideUp 0.3s ease-out forwards;
}
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

<div class="max-w-5xl mx-auto space-y-6">
<header class="bg-blue-800 text-white rounded-xl shadow-lg p-6 flex flex-col md:flex-row items-center justify-between">
<div>
<h1 class="text-2xl md:text-3xl font-bold">Dr. Lou Valmar T. Datu</h1>
<h2 class="text-blue-200 mt-1">Clinical Summary System</h2>
</div>
<button onclick="generateSummary()" class="mt-4 md:mt-0 bg-white text-blue-800 px-6 py-3 rounded-lg font-bold shadow hover:bg-blue-50 transition-colors">
Generate Summary
</button>
</header>

<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
<div class="bg-slate-50 border-b border-slate-200 px-6 py-4">
<h3 class="text-lg font-bold text-slate-800">Patient Information</h3>
</div>
<div class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
<div class="flex flex-col">
<label class="mb-1 text-sm font-semibold text-slate-600">Patient Name</label>
<input type="text" id="pat_name" class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>
<div class="flex flex-col">
<label class="mb-1 text-sm font-semibold text-slate-600">Age</label>
<input type="text" id="pat_age" class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>
<div class="flex flex-col">
<label class="mb-1 text-sm font-semibold text-slate-600">Sex</label>
<select id="pat_sex" class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
<option value="">Select...</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
</select>
</div>
<div class="flex flex-col">
<label class="mb-1 text-sm font-semibold text-slate-600">Date</label>
<input type="date" id="pat_date" class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>
</div>
</div>

<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
<div class="bg-slate-50 border-b border-slate-200 px-6 py-4">
<h3 class="text-lg font-bold text-slate-800">History of Present Illness (HPI)</h3>
</div>
<div class="p-6">
<div class="flex flex-col">
<label class="mb-1 text-sm font-semibold text-slate-600">HPI Narrative</label>
<textarea id="hpi_narrative" rows="5" placeholder="Type comprehensive HPI details here..." class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
</div>
</div>
</div>

<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
<div class="bg-slate-50 border-b border-slate-200 px-6 py-4">
<h3 class="text-lg font-bold text-slate-800">Past Medical, Family & Social History</h3>
</div>
<div class="p-6 space-y-6" id="history_container">
<!-- Dynamically populated via JS for Presets -->
</div>
</div>

<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
<div class="bg-slate-50 border-b border-slate-200 px-6 py-4">
<h3 class="text-lg font-bold text-slate-800">Review of Systems</h3>
</div>
<div class="p-6">
<div id="ros_container" class="space-y-6"></div>
</div>
</div>

<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
<div class="bg-slate-50 border-b border-slate-200 px-6 py-4">
<h3 class="text-lg font-bold text-slate-800">Physical Examination on Admission</h3>
</div>
<div class="p-6">
<!-- 1. General Survey Container -->
<div id="gs_container" class="space-y-6 mb-8 border-b border-slate-200 pb-6"></div>

<!-- 2. Vital Signs -->
<div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 mb-8 bg-blue-50 p-4 rounded-lg border border-blue-100">
<div class="flex flex-col"><label class="mb-1 text-sm font-semibold text-slate-600">BP (mmHg)</label><input type="text" id="vit_bp" class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
<div class="flex flex-col"><label class="mb-1 text-sm font-semibold text-slate-600">HR (bpm)</label><input type="text" id="vit_hr" class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
<div class="flex flex-col"><label class="mb-1 text-sm font-semibold text-slate-600">RR (cpm)</label><input type="text" id="vit_rr" class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
<div class="flex flex-col"><label class="mb-1 text-sm font-semibold text-slate-600">Temp (°C)</label><input type="text" id="vit_temp" class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
<div class="flex flex-col"><label class="mb-1 text-sm font-semibold text-slate-600">O2 Sat (%)</label><input type="text" id="vit_o2" class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
<div class="flex flex-col"><label class="mb-1 text-sm font-semibold text-slate-600">Height (cm)</label><input type="text" id="vit_ht" class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
<div class="flex flex-col"><label class="mb-1 text-sm font-semibold text-slate-600">Weight (kg)</label><input type="text" id="vit_wt" class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
</div>

<!-- 3-9. HEENT to Neuro -->
<div id="pe_container" class="space-y-6"></div>
</div>
</div>

<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6 border-t-4 border-t-blue-800 p-6">
<div class="flex flex-col md:flex-row items-center justify-between">
<div class="flex-1 w-full md:w-auto md:mr-8 mb-4 md:mb-0" id="rod_container">
<!-- Dynamically populated via JS for ROD Presets -->
</div>
<button onclick="generateSummary()" class="w-full md:w-auto mt-4 bg-blue-600 text-white px-8 py-3 rounded-lg font-bold shadow-md hover:bg-blue-700 transition-colors text-lg whitespace-nowrap">
Generate Summary
</button>
</div>
</div>
</div>

<!-- Summary Modal -->
<div id="summaryModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
<div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden fade-in">
<div class="bg-blue-800 px-6 py-4 flex justify-between items-center text-white">
<h3 class="text-xl font-bold">Generated Summary</h3>
<button onclick="closeModal()" class="text-white hover:text-blue-200 text-3xl leading-none">&times;</button>
</div>
<div class="p-6 flex-1 overflow-y-auto">
<pre id="summaryText" class="whitespace-pre-wrap font-mono text-sm bg-slate-50 p-4 rounded-lg border border-slate-200 text-slate-700"></pre>
</div>
<div class="p-6 border-t border-slate-200 bg-slate-50 flex items-center justify-between">
<span id="copyStatus" class="text-sm font-semibold text-green-600"></span>
<div class="space-x-3">
<button onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg font-semibold text-slate-600 hover:bg-slate-100">Close</button>
<button onclick="copyToClipboard()" class="px-4 py-2 bg-blue-600 rounded-lg font-semibold text-white hover:bg-blue-700 shadow-sm">Copy to Clipboard</button>
</div>
</div>
</div>
</div>

<script>
// Data Configuration
const GS_CATEGORIES = {
general: { label: 'General Survey Findings', options: ['Awake and alert', 'Altered sensorium'] }
};

const PE_CATEGORIES = {
heent: { label: 'HEENT', options: ['Essentially normal', 'Abnormal pupillary reaction', 'Cervical lymphadenopathy', 'Dry mucous membrane', 'Icteric sclerae', 'Pale conjunctivae', 'Sunken eyeballs', 'Sunken fontanelle', 'Tonsillar congestion'] },
chest: { label: 'Chest/Lungs', options: ['Essentially normal', 'Lump/s over breast(s)', 'Asymmetrical chest expansion', 'Rales/crackles/rhonchi', 'Decreased breath sounds', 'Intercostal rib/clavicular retraction', 'Wheezes'] },
cvs: { label: 'CVS', options: ['Essentially normal', 'Irregular rhythm', 'Displaced apex beat', 'Muffled heart sounds', 'Heaves and/or thrills', 'Murmur', 'Pericardial bulge'] },
abdomen: { label: 'Abdomen', options: ['Essentially normal', 'Palpable mass(es)', 'Abdominal rigidity', 'Tympanitic/dull abdomen', 'Abdomen tenderness', 'Hyperactive bowel sounds', 'Uterine contraction'] },
gu: { label: 'GU (IE)', options: ['Essentially normal', 'Blood stained in exam finger', 'Cervical dilatation', 'Presence of abnormal discharge'] },
skin: { label: 'Skin/Extremities', options: ['Essentially normal', 'Clubbing', 'Cold clammy skin', 'Cyanosis/mottled skin', 'Edema/swelling', 'Decreased mobility', 'Pale nailbeds', 'Poor skin turgor', 'Rashes/petechiae', 'Weak pulses'] },
neuro: { label: 'Neuro-Exam', options: ['Essentially normal', 'Abnormal gait', 'Abnormal position sense', 'Abnormal/decreased sensation', 'Abnormal reflex(es)', 'Poor/altered memory', 'Poor muscle tone/strength', 'Poor coordination'] }
};

// Updated ROS reordered based on requirements
const ROS_CATEGORIES = {
constitutional: { label: 'Constitutional', options: ['UNREMARKABLE', 'BODY MALAISE', 'ANOREXIA', 'FEVER', 'WEIGHT LOSS'] },
heent: {
label: 'HEENT',
options: [
'UNREMARKABLE', 'EPISTAXIS / NOSE BLEEDING', 'JAUNDICE', 'ICTERISIA', 'LOSS OF SMELL', 'REDNESS OF CONJUNCTIVAE',
'TINNITUS (LEFT)', 'TINNITUS (RIGHT)', 'BLURRING OF VISION (LEFT)', 'BLURRING OF VISION (RIGHT)',
'DEAFNESS (LEFT)', 'DEAFNESS (RIGHT)', 'EYE DISCHARGE (LEFT)', 'EYE DISCHARGE (RIGHT)',
'SORE THROAT', 'MASS ON THE NECK', 'DIFFICULTY SWALLOWING'
]
},
respiratory: { label: 'Respiratory', options: ['UNREMARKABLE', 'COUGH', 'DIFFICULTY OF BREATHING / DYSPNEA', 'HEMOPTYSIS', 'CYANOSIS'] },
cardiovascular: { label: 'Cardiovascular', options: ['UNREMARKABLE', 'CHEST PAIN', 'ORTHOPNEA', 'EDEMA OF LOWER EXTREMITIES', 'PALPITATIONS'] },
abdomen: { label: 'Abdomen', options: ['UNREMARKABLE', 'MELENA', 'ABDOMEN CRAMPS', 'VOMITING', 'CONSTIPATION', 'HEARTBURN', 'DIARRHEA', 'FLATULENCE', 'HEMATEMESIS', 'ABDOMINAL DISTENSION'] },
genitourinary: { label: 'Genitourinary', options: ['UNREMARKABLE', 'DYSURIA', 'FREQUENCY OF URINATION', 'HEMATURIA', 'URGENCY/DRIBBLING'] },
endocrine: { label: 'Endocrine', options: ['UNREMARKABLE', 'COLD SWEATS', 'POLYPHAGIA', 'POLYDIPSIA', 'POLYURIA', 'INTOLERANCE TO HEAT', 'INTOLERANCE TO COLD', 'FATIGUE'] },
hematology: { label: 'Hematology/Lymphatics', options: ['UNREMARKABLE', 'GUM BLEEDING', 'HEMATOMA/ECCHYMOSIS', 'LYMPHADENOPATHY'] },
integumentary: { label: 'Integumentary', options: ['UNREMARKABLE', 'PALLOR', 'ITCHINESS', 'ULCERATIONS', 'SCALING', 'ECCHYMOSIS', 'RASH'] },
psychosocial: { label: 'Psycho-Social', options: ['UNREMARKABLE', 'FLAT AFFECT', 'DEPRESSED', 'WITHDRAWN', 'EXCITED'] },
neurologic: { label: 'Neurologic', options: ['UNREMARKABLE', 'SEIZURE', 'ALTERED MENTAL SENSORIUM', 'SLURRED SPEECH', 'DIZZINESS / VERTIGO', 'NUMBNESS / LOSS OF SENSATION', 'PARALYSIS', 'HEADACHE', 'IRRITABILITY', 'TREMORS'] }
};

// Configuration for Form Fields
const HISTORY_FIELDS_CONFIG = [
{ key: 'pmh', label: 'Past Medical History (PMH)', placeholder: 'e.g. Hypertension, Type 2 Diabetes...', type: 'textarea' },
{ key: 'home_meds', label: 'Medications', placeholder: 'e.g. Losartan 50mg OD, Metformin 500mg BID...', type: 'textarea' },
{ key: 'fmh', label: 'Family Medical History (FMH)', placeholder: 'e.g. Asthma, Cancer...', type: 'textarea' },
{ key: 'psh', label: 'Personal and Social History (PSH)', placeholder: 'e.g. Appendectomy 2010...', type: 'textarea' }
];

const ROD_FIELD_CONFIG = [
{ key: 'rod', label: 'Resident on Duty (ROD)', placeholder: 'e.g. Dr. Juan Dela Cruz', type: 'input' }
];

function renderCheckboxGroup(containerId, dataObj, prefix) {
const container = document.getElementById(containerId);
if (!container) return;
let html = '';
for (const [key, cat] of Object.entries(dataObj)) {
html += `
<div class="mb-6 last:mb-0">
<h4 class="text-md font-bold text-blue-800 mb-3 border-b border-slate-100 pb-2">${cat.label}</h4>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mb-3">`;
cat.options.forEach((opt, idx) => {
const id = `${prefix}_${key}_${idx}`;
html += `
<label class="flex items-start space-x-3 cursor-pointer group">
<div class="flex items-center h-5">
<input type="checkbox" name="${prefix}_${key}" value="${opt}" id="${id}" class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500 cursor-pointer">
</div>
<div class="text-sm text-slate-700 group-hover:text-slate-900 leading-tight pt-0.5">${opt}</div>
</label>`;
});

html += `
</div>
<div class="flex items-center space-x-2 mt-2">
<span class="text-sm font-semibold text-slate-600 whitespace-nowrap">Others:</span>
<input type="text" id="${prefix}_${key}_others" placeholder="Specify other findings..." class="flex-1 px-3 py-1.5 text-sm border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800">
</div>
</div>`;
}
container.innerHTML = html;
}

function renderFormFields(containerId, fieldsConfig) {
const container = document.getElementById(containerId);
if (!container) return;
let html = '';
fieldsConfig.forEach(field => {
const inputHtml = field.type === 'input'
? `<input type="text" id="field_${field.key}" placeholder="${field.placeholder}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 transition-shadow">`
: `<textarea id="field_${field.key}" rows="2" placeholder="${field.placeholder}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y text-slate-800 transition-shadow"></textarea>`;
html += `
<div class="p-4 bg-slate-50 rounded-xl border border-slate-200 shadow-sm ${fieldsConfig.length === 1 ? 'border-0 p-0 shadow-none bg-transparent' : ''}">
<div class="flex flex-col w-full">
<label class="mb-1 text-sm font-semibold text-slate-600">${field.label}</label>
${inputHtml}
</div>
</div>`;
});
container.innerHTML = html;
}

window.generateSummary = function() {
let summary = `DR. LOU VALMAR T. DATU - CLINICAL SUMMARY\n`;
summary += `==========================================================\n\n`;
// Collect Demographics
summary += `PATIENT INFORMATION:\n`;
summary += `Name: ${document.getElementById('pat_name').value || 'N/A'}\n`;
summary += `Age/Sex: ${document.getElementById('pat_age').value || 'N/A'} / ${document.getElementById('pat_sex').value || 'N/A'}\n`;
summary += `Date: ${document.getElementById('pat_date').value || 'N/A'}\n\n`;

// Collect HPI
summary += `HISTORY OF PRESENT ILLNESS (HPI):\n`;
const hpiNarrative = document.getElementById('hpi_narrative').value.trim();
if (hpiNarrative) {
summary += `${hpiNarrative}\n`;
} else {
summary += `N/A\n`;
}
summary += `\n`;

// Collect New History Fields (PMH, Meds, FMH, PSH)
summary += `PAST MEDICAL, FAMILY & SOCIAL HISTORY:\n`;
HISTORY_FIELDS_CONFIG.forEach(field => {
summary += `${field.label}: ${document.getElementById(`field_${field.key}`).value.trim() || 'N/A'}\n`;
});
summary += `\n`;

// Collect ROS
summary += `REVIEW OF SYSTEMS:\n`;
let rosHasEntries = false;
Object.keys(ROS_CATEGORIES).forEach(key => {
const checkboxes = document.querySelectorAll(`input[name="ros_${key}"]:checked`);
const othersVal = document.getElementById(`ros_${key}_others`).value.trim();
if (checkboxes.length > 0 || othersVal) {
rosHasEntries = true;
let findings = Array.from(checkboxes).map(cb => cb.value);
if (othersVal) findings.push(`Others: ${othersVal}`);
summary += `${ROS_CATEGORIES[key].label}: ${findings.join(', ')}\n`;
} else {
summary += `${ROS_CATEGORIES[key].label}: UNREMARKABLE\n`;
rosHasEntries = true;
}
});
if (!rosHasEntries) summary += `No significant findings noted.\n`;
summary += `\n`;

// Collect PE
summary += `PHYSICAL EXAMINATION ON ADMISSION:\n`;

// 1. General Survey Findings
let gsFindings = [];
let gsHasEntries = false;
Object.keys(GS_CATEGORIES).forEach(key => {
const checkboxes = document.querySelectorAll(`input[name="gs_${key}"]:checked`);
const othersVal = document.getElementById(`gs_${key}_others`).value.trim();
if (checkboxes.length > 0 || othersVal) {
gsHasEntries = true;
gsFindings = Array.from(checkboxes).map(cb => cb.value);
if (othersVal) gsFindings.push(`Others: ${othersVal}`);
}
});
if (gsHasEntries) {
summary += `General Survey: ${gsFindings.join(', ')}\n`;
} else {
summary += `General Survey: Awake and alert\n`;
}

// 2. Vital Signs
summary += `Vital Signs: BP: ${document.getElementById('vit_bp').value || '___'} | HR: ${document.getElementById('vit_hr').value || '___'} | RR: ${document.getElementById('vit_rr').value || '___'} | Temp: ${document.getElementById('vit_temp').value || '___'} | O2 Sat: ${document.getElementById('vit_o2').value || '___'} | Height: ${document.getElementById('vit_ht').value || '___'} | Weight: ${document.getElementById('vit_wt').value || '___'}\n`;

// 3-9. HEENT to Neuro
let peHasEntries = false;
Object.keys(PE_CATEGORIES).forEach(key => {
const checkboxes = document.querySelectorAll(`input[name="pe_${key}"]:checked`);
const othersVal = document.getElementById(`pe_${key}_others`).value.trim();
if (checkboxes.length > 0 || othersVal) {
peHasEntries = true;
let findings = Array.from(checkboxes).map(cb => cb.value);
if (othersVal) findings.push(`Others: ${othersVal}`);
summary += `${PE_CATEGORIES[key].label}: ${findings.join(', ')}\n`;
} else {
summary += `${PE_CATEGORIES[key].label}: Essentially normal\n`;
peHasEntries = true;
}
});
if (!peHasEntries && !gsHasEntries) summary += `No significant findings noted.\n`;
summary += `\n`;

// Collect ROD
summary += `==========================================================\n`;
summary += `ROD (Resident on Duty): ${document.getElementById('field_rod').value.trim() || 'N/A'}\n`;

// Show Modal
document.getElementById('summaryText').innerText = summary;
document.getElementById('copyStatus').innerText = '';
const modal = document.getElementById('summaryModal');
modal.classList.remove('hidden');
modal.classList.add('flex');
};

window.closeModal = function() {
const modal = document.getElementById('summaryModal');
modal.classList.add('hidden');
modal.classList.remove('flex');
};

window.copyToClipboard = function() {
const text = document.getElementById('summaryText').innerText;
const statusEl = document.getElementById('copyStatus');
if (navigator.clipboard && window.isSecureContext) {
navigator.clipboard.writeText(text)
.then(() => statusEl.innerText = 'Copied to clipboard!')
.catch(() => fallbackCopy(text, statusEl));
} else {
fallbackCopy(text, statusEl);
}
};

function fallbackCopy(text, statusEl) {
const textArea = document.createElement("textarea");
textArea.value = text;
textArea.style.position = "fixed";
textArea.style.left = "-999999px";
document.body.appendChild(textArea);
textArea.select();
try {
document.execCommand('copy');
statusEl.innerText = 'Copied to clipboard!';
} catch (err) {
statusEl.innerText = 'Failed to copy. Please select manually.';
statusEl.classList.replace('text-green-600', 'text-red-500');
}
document.body.removeChild(textArea);
}

// Initialize UI
renderCheckboxGroup('gs_container', GS_CATEGORIES, 'gs');
renderCheckboxGroup('pe_container', PE_CATEGORIES, 'pe');
renderCheckboxGroup('ros_container', ROS_CATEGORIES, 'ros');
renderFormFields('history_container', HISTORY_FIELDS_CONFIG);
renderFormFields('rod_container', ROD_FIELD_CONFIG);
</script>
</body>
</html>
